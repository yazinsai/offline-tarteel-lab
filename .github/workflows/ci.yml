name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: pytest

      - name: Lint Python
        run: ruff check .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: orchestration/package-lock.json

      - name: Install orchestration dependencies
        working-directory: orchestration
        run: npm ci

      - name: Typecheck orchestration
        working-directory: orchestration
        run: npx tsc --noEmit
