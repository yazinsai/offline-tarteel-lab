name: Cursor Cloud Autonomy

on:
  workflow_dispatch:
    inputs:
      max_cycles:
        description: "Maximum queued tasks to evaluate"
        required: false
        default: "1"
      limit:
        description: "Benchmark sample limit"
        required: false
        default: "12"
      seed_sweeps:
        description: "Replenish autonomous task backlog"
        required: false
        default: "true"
        type: choice
        options: ["false", "true"]
      allow_modal:
        description: "Allow Modal training launches"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      target_backlog:
        description: "Desired queued/running task backlog"
        required: false
        default: "8"
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: cursor-cloud-autonomy
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard_index: [0, 1, 2]
    env:
      CURSOR_BASE_PREFIX: cursor-autonomy-base-${{ github.run_id }}-
      CURSOR_BASE_REF: cursor-autonomy-base-${{ github.run_id }}-${{ matrix.shard_index }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Clean stale autonomy branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          open_refs="$(
            gh pr list --state open --limit 100 --json headRefName,baseRefName \
              --jq '.[] | .headRefName, .baseRefName' |
              awk 'NF' |
              sort -u
          )"

          is_open_ref() {
            printf '%s\n' "$open_refs" | grep -Fxq "$1"
          }

          delete_branch() {
            ref="$1"
            if [ -z "$ref" ] || [ "$ref" = "main" ] || [ "$ref" = "$CURSOR_BASE_REF" ]; then
              return 0
            fi
            if [[ "$ref" == "$CURSOR_BASE_PREFIX"* ]]; then
              return 0
            fi
            if is_open_ref "$ref"; then
              return 0
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" || true
          }

          gh pr list --state closed --limit 200 --json headRefName \
            --jq '.[].headRefName' |
            awk 'NF && $0 ~ /^cursor\// { print }' |
            sort -u |
            while IFS= read -r ref; do
              delete_branch "$ref"
            done

          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/cursor-autonomy-base-" \
            --jq '.[].ref' |
            sed 's#^refs/heads/##' |
            sort -u |
            while IFS= read -r ref; do
              delete_branch "$ref"
            done

      - name: Publish exact Cursor base branch
        run: git push --force origin "HEAD:refs/heads/$CURSOR_BASE_REF"

      - name: Validate Modal credentials
        if: ${{ github.event.inputs.allow_modal == 'true' }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_PROFILE: ${{ secrets.MODAL_PROFILE }}
          MODAL_ENVIRONMENT: ${{ secrets.MODAL_ENVIRONMENT }}
        run: |
          python3 -m pip install modal
          modal token info

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: orchestration/package-lock.json

      - name: Install orchestration dependencies
        working-directory: orchestration
        run: npm ci

      - name: Dispatch Cursor Cloud autonomous cycle
        working-directory: orchestration
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_PROFILE: ${{ secrets.MODAL_PROFILE }}
          MODAL_ENVIRONMENT: ${{ secrets.MODAL_ENVIRONMENT }}
          OFFLINE_TARTEEL_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          OFFLINE_TARTEEL_REF: ${{ env.CURSOR_BASE_REF }}
          CURSOR_SKIP_REVIEWER: "1"
          LAB_AUTONOMY_MAX_CYCLES: ${{ github.event.inputs.max_cycles || '1' }}
          LAB_AUTONOMY_TARGET_BACKLOG: ${{ github.event.inputs.target_backlog || '8' }}
          LAB_AUTONOMY_LIMIT: ${{ github.event.inputs.limit || '12' }}
          LAB_AUTONOMY_PLAN: ${{ github.event.inputs.seed_sweeps || '1' }}
          LAB_AUTONOMY_ALLOW_MODAL: ${{ github.event.inputs.allow_modal || 'false' }}
          LAB_AUTONOMY_SHARD_INDEX: ${{ matrix.shard_index }}
          LAB_AUTONOMY_SHARD_TOTAL: "3"
        run: npm run cloud:autonomy
