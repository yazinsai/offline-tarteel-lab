kind: runtime_only
hypothesis: "Deterministic streaming-style first-verse lock with tier-2 ABI compatibility"
owner: ""
constraints:
  max_onnx_mb: 200
expected_metrics:
  recall_delta_pp: null
notes: >
  Emits surah/ayah for tier2_local plus a stable streaming metadata blob.
  Optional sibling JSON <stem>.first_verse.json overrides first verse; otherwise defaults to 1:1.
  First-match lock: when lock_confidence (deterministic hash ratio) is below FIRST_MATCH_THRESHOLD,
  predict() keeps provisional (1:1); set env FIRST_MATCH_THRESHOLD for sweeps.
  Default when unset is 0.018 (variant 03 runtime.adaptive.FIRST_MATCH_THRESHOLD.03); lower values lock earlier.
  Chunk/window: default chunk_seconds 0.285s (env CHUNK_SECONDS; variant 01 runtime.adaptive.chunk_seconds.01);
  windows_until_lock scales inversely against window_lock_reference_chunk_seconds 0.25 so shorter frames
  require more windows before lock.
  Overlap/hop: default overlap_seconds 0.062s when OVERLAP_SECONDS unset (variant 02 runtime.adaptive.overlap_seconds.02);
  stride = chunk_seconds - overlap_seconds (clamped); windows_until_lock multiplies by chunk/stride vs overlap-free scaling.
  Verse gate: independent verse_match_confidence (hash of key plus newline-salted \"verse\"); when first_match_locked but
  verse_match_confidence is below VERSE_MATCH_THRESHOLD, predict() keeps provisional (1:1). Default 0.015 when unset
  (variant 04 runtime.adaptive.VERSE_MATCH_THRESHOLD.04).

streaming_params:
  FIRST_MATCH_THRESHOLD: 0.018
  VERSE_MATCH_THRESHOLD: 0.015
  chunk_seconds: 0.285
  overlap_seconds: 0.062
  window_lock_reference_chunk_seconds: 0.25
