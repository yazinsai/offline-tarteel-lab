kind: runtime_only
hypothesis: "Deterministic streaming-style first-verse lock with tier-2 ABI compatibility"
owner: ""
constraints:
  max_onnx_mb: 200
expected_metrics:
  recall_delta_pp: null
notes: >
  Emits surah/ayah for tier2_local plus a stable streaming metadata blob.
  Optional sibling JSON <stem>.first_verse.json overrides first verse; otherwise defaults to 1:1.
  First-match lock: when lock_confidence (deterministic hash ratio) is below FIRST_MATCH_THRESHOLD,
  predict() keeps provisional (1:1); set env FIRST_MATCH_THRESHOLD for sweeps. Default 0.0 locks immediately.
  Chunk/window: default chunk_seconds follows streaming_params below when CHUNK_SECONDS is unset (variant 01: 0.28s).
  windows_until_lock scales inversely against window_lock_reference_chunk_seconds 0.25 so shorter frames require more windows before lock.
  Negative memory: avoid prior blocked autonomy paths listed under benchmarks/adaptive_chunk_seconds_01/.

adaptive_variants:
  chunk_seconds_variant_01:
    autopilot_key: runtime.adaptive.chunk_seconds.01
    benchmark_manifest: benchmarks/adaptive_chunk_seconds_01/metadata.json

streaming_params:
  FIRST_MATCH_THRESHOLD: 0.0
  chunk_seconds: 0.28
  window_lock_reference_chunk_seconds: 0.25
