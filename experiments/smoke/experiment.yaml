kind: runtime_only
hypothesis: "Deterministic streaming-style first-verse lock with tier-2 ABI compatibility; weighted geometric fusion (0.515/0.485 primary/aux); FIRST_MATCH_THRESHOLD variant 11; VERSE_MATCH_THRESHOLD default variant 12 (runtime.adaptive.VERSE_MATCH_THRESHOLD.12); SMOOTHING_WINDOW default variant 13 (runtime.adaptive.smoothing_window.13)"
owner: ""
constraints:
  max_onnx_mb: 200
expected_metrics:
  recall_delta_pp: null
notes: >
  Emits surah/ayah for tier2_local plus a stable streaming metadata blob.
  Fusion stack: dual-hash ratios SHA-256(key) and BLAKE2b(key + "|corpus-v3-explore"); lock_confidence is a
  weighted geometric blend (exploit champion: w_primary=0.515, w_aux=0.485), exposing lock_confidence_primary,
  lock_confidence_aux, and lock_confidence_fusion in streaming metadata.
  Optional sibling JSON <stem>.first_verse.json overrides first verse; otherwise defaults to 1:1.
  First-match lock: when lock_confidence (fused ratio) is below FIRST_MATCH_THRESHOLD,
  predict() keeps provisional (1:1); set env FIRST_MATCH_THRESHOLD for sweeps.
  Default when unset is 0.0165 (variant 11 runtime.adaptive.FIRST_MATCH_THRESHOLD.11); lower values lock earlier
  than variant 03's 0.018.
  Verse-match gate: secondary threshold on the same lock_confidence ratio (env VERSE_MATCH_THRESHOLD;
  variant 12 runtime.adaptive.VERSE_MATCH_THRESHOLD.12 default 0.408, slightly relaxed vs variant 04's 0.412).
  Metadata-only; tier-2 accuracy still follows first-match surah/ayah.
  Chunk/window: default chunk_seconds 0.268s (env CHUNK_SECONDS; variant 09 runtime.adaptive.chunk_seconds.09);
  windows_until_lock scales inversely against window_lock_reference_chunk_seconds 0.25 so shorter frames
  require more windows before lock.
  Overlap/hop: default overlap_seconds 0.071s when OVERLAP_SECONDS unset (variant 10 runtime.adaptive.overlap_seconds.10);
  stride = chunk_seconds - overlap_seconds (clamped); windows_until_lock multiplies by chunk/stride vs overlap-free scaling.
  Smoothing window: integer SMOOTHING_WINDOW frames (variant 13 runtime.adaptive.smoothing_window.13 default 4 when unset;
  variant 05 used 3): scales windows_until_lock by (1 + 0.035 * frames) for observable delay without changing first-match surah/ayah.
  Correction hysteresis: CORRECTION_HYSTERESIS (variant 06 runtime.adaptive.correction_hysteresis.06 default 0.012 when unset):
  first-match locks when lock_confidence >= FIRST_MATCH_THRESHOLD + hysteresis; windows_until_lock also scales by (1 + 0.045 * hysteresis).
  Partial-match margin: PARTIAL_MATCH_MARGIN (variant 07 runtime.adaptive.partial_match_margin.07 default 0.008 when unset):
  first-match lock requires lock_confidence >= first_match_effective_threshold + margin (first_match_lock_bar); tier-2 surah/ayah follow the same lock rule.
  Correction debounce: DEBOUNCE_MS (variant 08 runtime.adaptive.debounce_ms.08 default 52 when unset): metadata-only multiplier
  (debounce_lock_delay_multiplier) on windows_until_lock; does not change first-match lock bar or tier-2 labels.

streaming_params:
  FIRST_MATCH_THRESHOLD: 0.0165
  VERSE_MATCH_THRESHOLD: 0.408
  chunk_seconds: 0.268
  overlap_seconds: 0.071
  smoothing_window: 4
  correction_hysteresis: 0.012
  partial_match_margin: 0.008
  debounce_ms: 52
  window_lock_reference_chunk_seconds: 0.25
